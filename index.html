<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据建模工作台 · 数仓模型设计</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='9' height='9' rx='2' fill='%233b82f6'/%3E%3Crect x='13' y='2' width='9' height='9' rx='2' fill='%2310b981'/%3E%3Crect x='2' y='13' width='9' height='9' rx='2' fill='%23f59e0b'/%3E%3Crect x='13' y='13' width='9' height='9' rx='2' fill='%238b5cf6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=1795146621">
<script>try{var t=localStorage.getItem('dw-workbench-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span class="brand-logo"><svg width="20" height="20" viewBox="0 0 24 24"><rect x="2" y="2" width="9" height="9" rx="2.5" fill="#3672f0"/><rect x="13" y="2" width="9" height="9" rx="2.5" fill="#0aa2c0"/><rect x="2" y="13" width="9" height="9" rx="2.5" fill="#159a62"/><rect x="13" y="13" width="9" height="9" rx="2.5" fill="#8256f0"/></svg></span>
    <div>
      <div class="brand-name">数据建模工作台</div>
      <div class="brand-sub">DATA WAREHOUSE WORKBENCH</div>
    </div>
  </div>
  <div class="topbar-center">
    <input id="project-name" title="项目名称" placeholder="项目名称">
    <select id="dialect" title="默认 SQL 方言">
      <option value="hive">Hive / SparkSQL</option>
      <option value="mysql">MySQL</option>
      <option value="clickhouse">ClickHouse</option>
      <option value="postgresql">PostgreSQL</option>
    </select>
    <span id="save-status" class="save-status"></span>
  </div>
  <div class="topbar-actions">
    <button class="btn" id="btn-import" title="粘贴 SQL 反解析为模型"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v7M5.2 6.8 8 9.6l2.8-2.8M2.8 13h10.4"/></svg>导入SQL</button>
    <button class="btn" id="btn-gensql" title="生成建表与 ETL 脚本"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5"/></svg>生成SQL</button>
    <button class="btn" id="btn-check" title="模型规范校验"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.8"/><path d="M5.4 8.2l1.8 1.8 3.4-3.8"/></svg>校验</button>
    <button class="btn dsh-btn" id="btn-dsh" title="把复杂任务交给 DSH 智能体执行"><svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" stroke="none"><path d="M6.8 2.2l1 3.1 3.1 1-3.1 1-1 3.1-1-3.1-3.1-1 3.1-1 1-3.1z"/><path d="M11.6 8.6l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2z"/></svg>DSH任务</button>
    <button class="btn primary" id="btn-save" title="保存到数据库（Ctrl+S）"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 5.5 5.5 2.8h7.7v10.4H2.8z"/><path d="M5.2 2.8v3.5h5.4V2.8"/><path d="M5.2 13.2V9.2h5.6v4"/></svg>保存</button>
    <button class="btn ghost" id="btn-theme" title="切换主题">
      <svg class="icon-moon" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13.4 9.8A5.6 5.6 0 0 1 6.2 2.6 5.6 5.6 0 1 0 13.4 9.8z"/></svg>
      <svg class="icon-sun" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.3 3.3l1.1 1.1M11.6 11.6l1.1 1.1M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1"/></svg>
    </button>
    <details class="more-menu">
      <summary class="btn" title="更多">⋯</summary>
      <div class="menu-pop">
        <button id="btn-export">⬇ 导出 project.json</button>
        <button id="btn-export-excel">⬇ 导出 Excel 数据字典</button>
        <button id="btn-import-excel">⬆ 导入 Excel 数据字典</button>
        <button id="btn-import-json">⬆ 导入 project.json</button>
        <hr>
        <button id="btn-sample">✨ 加载示例项目</button>
      </div>
    </details>
  </div>
</header>

<div id="layout">
  <aside id="sidebar">
    <div class="sidebar-head">
      <span>数据分层</span>
      <button class="btn small primary" id="btn-new-model">＋ 新建模型</button>
    </div>
    <div id="layer-groups"></div>
    <div class="sidebar-foot">
      <div class="layer-legend">
        <span><i class="layer-dot ods"></i>贴源</span>
        <span><i class="layer-dot dim"></i>维度</span>
        <span><i class="layer-dot dwd"></i>明细</span>
        <span><i class="layer-dot dws"></i>汇总</span>
        <span><i class="layer-dot ads"></i>应用</span>
      </div>
    </div>
  </aside>

  <main id="main">
    <nav id="tabs">
      <button data-tab="model" class="active">模型设计</button>
      <button data-tab="lineage">血缘关系</button>
      <button data-tab="sql">SQL 脚本</button>
    </nav>
    <div id="pane-scroll">
      <section id="pane-model"></section>
      <section id="pane-lineage" style="display:none"></section>
      <section id="pane-sql" style="display:none"></section>
    </div>
  </main>
</div>

<div id="modal-root"></div>

<script src="js/sql-lexer.js?v=1795146621"></script>
<script src="js/sql-parser.js?v=1795146621"></script>
<script src="js/sql-generator.js?v=1795146621"></script>
<script src="js/lineage.js?v=1795146621"></script>
<script src="js/sample.js?v=1795146621"></script>
<script src="js/xlsx-export.js?v=1795146621"></script>
<script src="js/store.js?v=1795146621"></script>
<script src="js/editor.js?v=1795146621"></script>
<script src="js/dialogs.js?v=1795146621"></script>
<script src="js/app.js?v=1795146621"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据建模工作台 · 数仓模型设计</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='6' fill='%237c3aed'/%3E%3Crect x='6' y='6' width='5' height='5' rx='1.6' fill='%23fff'/%3E%3Crect x='13' y='6' width='5' height='5' rx='1.6' fill='%23fff' opacity='.65'/%3E%3Crect x='6' y='13' width='5' height='5' rx='1.6' fill='%23fff' opacity='.65'/%3E%3Crect x='13' y='13' width='5' height='5' rx='1.6' fill='%23fff' opacity='.42'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=20261124b">
<script>try{var t=localStorage.getItem('dw-workbench-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span class="brand-logo">
      <svg width="17" height="17" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2.6" fill="#fff"/><rect x="13" y="3" width="8" height="8" rx="2.6" fill="#fff" opacity=".62"/><rect x="3" y="13" width="8" height="8" rx="2.6" fill="#fff" opacity=".62"/><rect x="13" y="13" width="8" height="8" rx="2.6" fill="#fff" opacity=".38"/></svg>
    </span>
    <div>
      <div class="brand-name">数据建模工作台</div>
      <div class="brand-sub">WAREHOUSE WORKBENCH</div>
    </div>
  </div>

  <span class="tb-div"></span>

  <div class="topbar-center">
    <select id="project-select" title="切换项目"></select>
    <input id="project-name" type="hidden">
    <select id="dialect" title="默认 SQL 方言">
      <option value="hive">Hive / SparkSQL</option>
      <option value="mysql">MySQL</option>
      <option value="clickhouse">ClickHouse</option>
      <option value="postgresql">PostgreSQL</option>
    </select>
    <span id="save-status" class="save-status"></span>
  </div>

  <div class="topbar-actions">
    <details class="more-menu tm-menu">
      <summary class="btn tm-summary" title="新建/管理项目、导入导出">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 4.4h4l1.4 1.8h6.2v6.4H2.2z"/><path d="M2.2 6.2h11.6"/></svg>
        <span>项目管理</span>
        <svg class="tm-caret" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.4 6.4 8 10l3.6-3.6"/></svg>
      </summary>
      <div class="menu-pop">
        <button id="btn-new-project">＋ 新建项目</button>
        <button id="btn-manage-projects">⚙ 管理项目（改名 / 删除）</button>
        <button id="btn-rename-project">✏ 重命名当前项目</button>
        <hr>
        <button id="btn-export">导出 project.json</button>
        <button id="btn-import-json">导入 project.json</button>
        <button id="btn-export-excel">导出 Excel 数据字典</button>
        <button id="btn-import-excel">导入 Excel 数据字典</button>
        <hr>
        <button id="btn-sample">✨ 加载示例项目（数仓）</button>
        <button id="btn-sample-oltp">🗃 加载示例项目（业务库）</button>
      </div>
    </details>

    <details class="more-menu tm-menu">
      <summary class="btn tm-summary" title="建模：导入、生成 SQL、校验">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.4" y="2.4" width="4.2" height="4.2" rx="1"/><rect x="9.4" y="2.4" width="4.2" height="4.2" rx="1"/><rect x="2.4" y="9.4" width="4.2" height="4.2" rx="1"/><rect x="9.4" y="9.4" width="4.2" height="4.2" rx="1"/></svg>
        <span>数据模型</span>
        <svg class="tm-caret" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.4 6.4 8 10l3.6-3.6"/></svg>
      </summary>
      <div class="menu-pop">
        <button id="btn-import">粘贴 SQL 导入（反解析建模）</button>
        <hr>
        <button id="btn-gensql">生成 SQL（建表 / ETL）</button>
        <button id="btn-check">模型规范校验</button>
        <button id="btn-dsh">DSH 智能体任务</button>
      </div>
    </details>

    <details class="more-menu tm-menu">
      <summary class="btn tm-summary" title="数据库连接、物化同步、反向导入">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="8" cy="4.2" rx="5.4" ry="2.1"/><path d="M2.6 4.2v7.4c0 1.2 2.4 2.1 5.4 2.1s5.4-.9 5.4-2.1V4.2"/><path d="M2.6 7.9c0 1.2 2.4 2.1 5.4 2.1s5.4-.9 5.4-2.1"/></svg>
        <span>数据源</span>
        <svg class="tm-caret" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.4 6.4 8 10l3.6-3.6"/></svg>
      </summary>
      <div class="menu-pop">
        <button id="btn-db-connections">🔌 数据库连接管理</button>
        <button id="btn-import-db">从数据库反向导入（表 → 模型）</button>
        <hr>
        <button id="btn-mat-entry">⚡ 物化到库（模型 → 真实表）</button>
        <button id="btn-diff-entry">⇄ 结构对比（模型 ⇄ 库，生成 ALTER）</button>
        <hr>
        <button id="btn-push-ods" style="display:none">⇢ 推送到数仓（→ ODS）</button>
      </div>
    </details>

    <button class="btn ghost icon" id="btn-theme" title="切换主题">
      <svg class="icon-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.3 9.9A5.6 5.6 0 0 1 6.1 2.7 5.6 5.6 0 1 0 13.3 9.9z"/></svg>
      <svg class="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.3 3.3l1.1 1.1M11.6 11.6l1.1 1.1M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1"/></svg>
    </button>
    <button class="btn primary" id="btn-save" title="保存到数据库（Ctrl+S）">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 5.6 5.6 2.8h7.6v10.4H2.8z"/><path d="M5.3 2.8v3.4h5.3V2.8"/><path d="M5.3 13.2V9.3h5.4v3.9"/></svg>保存
    </button>
  </div>
</header>

<div id="layout">
  <aside id="sidebar">
    <button class="rail-btn" id="rail-btn" title="收起 / 展开侧栏">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.4 5.4 8 10 12.6"/></svg>
    </button>

    <div class="sb-head">
      <div class="sb-top"><span class="sb-label">项目结构</span></div>
      <div class="model-search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7.2" cy="7.2" r="4.4"/><path d="M10.5 10.5 13.6 13.6"/></svg>
        <input id="model-search" placeholder="搜索模型、字段…" autocomplete="off">
      </div>
      <div class="sidebar-toggle">
        <div class="seg">
          <button class="seg-btn active" data-view="layer">按分层</button>
          <button class="seg-btn" data-view="catalog">按业务目录</button>
        </div>
      </div>
    </div>

    <div class="sidebar-head">
      <span id="sidebar-title">数据分层</span>
    </div>

    <div id="layer-groups"></div>
    <div id="catalog-view" style="display:none"></div>

    <div class="sidebar-foot">
      <div class="layer-legend">
        <span><i class="layer-dot ods"></i>贴源</span>
        <span><i class="layer-dot dim"></i>维度</span>
        <span><i class="layer-dot dwd"></i>明细</span>
        <span><i class="layer-dot dws"></i>汇总</span>
        <span><i class="layer-dot ads"></i>应用</span>
      </div>
      <button class="btn small soft" id="btn-new-model" style="width:100%;justify-content:center">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3.6v8.8M3.6 8h8.8"/></svg><span id="new-model-label">新建模型</span>
      </button>
    </div>

    <div class="rail-list">
      <button class="rail-item active" data-rail="model" title="模型设计">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2.3" y="2.3" width="11.4" height="11.4" rx="2.4"/><path d="M2.3 6.2h11.4M6.4 6.2v7.6"/></svg>
      </button>
      <button class="rail-item" data-rail="lineage" title="血缘关系">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="3.6" cy="8" r="1.7"/><circle cx="12.4" cy="3.9" r="1.7"/><circle cx="12.4" cy="12.1" r="1.7"/><path d="M5.2 7.2 10.8 4.6M5.2 8.8l5.6 2.6"/></svg>
      </button>
      <button class="rail-item" data-rail="sql" title="SQL 脚本">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.6 4.6 2.2 8l3.4 3.4M10.4 4.6 13.8 8l-3.4 3.4"/></svg>
      </button>
      <button class="rail-item" data-rail="new" title="新建模型">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3.4v9.2M3.4 8h9.2"/></svg>
      </button>
    </div>
  </aside>

  <main id="main">
    <nav id="tabs">
      <button data-tab="model" class="active">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2.3" y="2.3" width="11.4" height="11.4" rx="2.4"/><path d="M2.3 6.2h11.4M6.4 6.2v7.6"/></svg>
        模型设计
      </button>
      <button data-tab="lineage">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="3.6" cy="8" r="1.7"/><circle cx="12.4" cy="3.9" r="1.7"/><circle cx="12.4" cy="12.1" r="1.7"/><path d="M5.2 7.2 10.8 4.6M5.2 8.8l5.6 2.6"/></svg>
        <span class="tab-label">血缘关系</span>
      </button>
      <button data-tab="sql">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.6 4.6 2.2 8l3.4 3.4M10.4 4.6 13.8 8l-3.4 3.4"/></svg>
        SQL 脚本
      </button>
    </nav>

    <div id="pane-scroll">
      <section id="pane-model"></section>
      <section id="pane-lineage" style="display:none"></section>
      <section id="pane-sql" style="display:none"></section>
    </div>
  </main>
</div>

<div id="modal-root"></div>

<script src="js/sql-lexer.js?v=20261127a"></script>
<script src="js/sql-parser.js?v=20261127a"></script>
<script src="js/sql-generator.js?v=20261124a"></script>
<script src="js/lineage.js?v=20261124a"></script>
<script src="js/er.js?v=20261127a"></script>
<script src="js/sample.js?v=20261124a"></script>
<script src="js/sample-oltp.js?v=20261124a"></script>
<script src="js/xlsx-export.js?v=20261124a"></script>
<script src="js/store.js?v=20261124a"></script>
<script src="js/editor.js?v=20261124a"></script>
<script src="js/dialogs.js?v=20261127f"></script>
<script src="js/materialize.js?v=20261127e"></script>
<script src="js/diffui.js?v=20261127a"></script>
<script src="js/app.js?v=20261124b"></script>
</body>
</html>
